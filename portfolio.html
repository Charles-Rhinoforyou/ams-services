<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Réalisations – AMS'SERVICES Chambéry | Photos Chantiers</title>
  <meta name="description" content="Découvrez les réalisations d'AMS'SERVICES à Chambéry : plomberie, électricité, volets roulants, bricolage, décoration. Photos avant/après en Savoie." />
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Portfolio hero ── */
    .portfolio-hero { background: linear-gradient(135deg, var(--blue) 0%, #1a4fa0 100%); padding: 80px 0 60px; color: var(--white); text-align: center; }
    .portfolio-hero h1 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 1rem; }
    .portfolio-hero h1 em { color: var(--orange); font-style: normal; }
    .portfolio-hero p { font-size: 1.15rem; opacity: .9; max-width: 600px; margin: 0 auto 2rem; }
    .portfolio-stats { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; margin-top: 2rem; }
    .portfolio-stat { text-align: center; }
    .portfolio-stat .num { font-size: 2rem; font-weight: 800; color: var(--orange); }
    .portfolio-stat .label { font-size: .85rem; opacity: .8; }

    /* ── Theme nav pills ── */
    .theme-nav { background: var(--white); border-bottom: 1px solid #E5E7EB; position: sticky; top: 0; z-index: 90; padding: 12px 0; overflow-x: auto; }
    .theme-nav-inner { display: flex; gap: 8px; padding: 0 24px; min-width: max-content; }
    .theme-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; background: var(--gray-l); border-radius: 50px; font-size: .875rem; font-weight: 500; color: var(--dark); text-decoration: none; white-space: nowrap; transition: all .2s; border: 2px solid transparent; }
    .theme-pill:hover, .theme-pill.active { background: var(--blue); color: var(--white); }

    /* ── Portfolio sections ── */
    .portfolio-section { padding: 64px 0; }
    .portfolio-section:nth-child(even) { background: var(--gray-l); }
    .section-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 40px; }
    .section-icon { font-size: 2.5rem; flex-shrink: 0; }
    .section-service-link { display: inline-flex; align-items: center; gap: 6px; font-size: .875rem; color: var(--blue); font-weight: 500; text-decoration: none; margin-top: 6px; }
    .section-service-link:hover { text-decoration: underline; }
    .section-service-link svg { transition: transform .2s; }
    .section-service-link:hover svg { transform: translateX(3px); }

    /* ── Lightbox ── */
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 8px; }
    .lightbox-close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; background: none; border: none; line-height: 1; }
    .lightbox-caption { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: .9rem; background: rgba(0,0,0,.5); padding: 6px 16px; border-radius: 20px; white-space: nowrap; }

    /* ── Avant/Après card ── */
    .avant-apres-card { border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 0; }
    .avant-apres-card img { width: 100%; max-height: 420px; object-fit: contain; background: #f8f9fa; display: block; cursor: zoom-in; }
    .avant-apres-label { background: var(--blue); color: #fff; text-align: center; padding: 10px 16px; font-weight: 600; font-size: .9rem; }

    /* ── Realisation (fiche blog) cards ── */
    .reals-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }

    .real-card { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
    .real-card .avant-apres-card { border-radius: var(--radius) var(--radius) 0 0; }

    .real-main-img-wrap { position: relative; overflow: hidden; background: #000; cursor: zoom-in; border-radius: var(--radius) var(--radius) 0 0; }
    .real-main-img { width: 100%; height: 280px; object-fit: cover; display: block; transition: transform .4s ease, opacity .3s; }
    .real-main-img-wrap:hover .real-main-img { transform: scale(1.04); opacity: .92; }
    .real-photo-label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,.75)); color: #fff; padding: 24px 12px 10px; font-size: .8rem; font-weight: 500; }

    .real-body { padding: 18px 22px 22px; flex: 1; }
    .real-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .real-chip { display: inline-flex; align-items: center; gap: 4px; background: #EFF6FF; color: var(--blue); border-radius: 20px; padding: 3px 10px; font-size: .77rem; font-weight: 600; }
    .real-titre { font-size: 1.05rem; font-weight: 700; color: var(--dark); margin: 0 0 4px; }
    .real-sous-titre { font-size: .88rem; color: var(--gray); margin: 0 0 10px; font-style: italic; }
    .real-desc { font-size: .88rem; color: #374151; line-height: 1.6; margin: 0; }

    .real-secondaires { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; border-top: 1px solid #E5E7EB; padding-top: 12px; }
    .real-sec-item { position: relative; border-radius: 8px; overflow: hidden; cursor: zoom-in; background: #000; flex: 1 1 80px; min-width: 80px; max-width: 140px; }
    .real-sec-item img { width: 100%; height: 80px; object-fit: cover; display: block; transition: transform .3s; }
    .real-sec-item:hover img { transform: scale(1.07); }
    .real-sec-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.65); color: #fff; font-size: .68rem; padding: 3px 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Single realisation: full width, taller image */
    .reals-single .real-main-img { height: 380px; }
    .reals-single .avant-apres-card img { max-height: 460px; }
    .reals-single .real-sec-item { max-width: 180px; }
    .reals-single .real-sec-item img { height: 100px; }

    /* Responsive */
    @media(max-width:900px) {
      .reals-grid { grid-template-columns: 1fr; }
    }
    @media(max-width:640px) {
      .reals-single .real-main-img { height: 240px; }
      .avant-apres-card img { max-height: 260px; }
      .section-header { flex-direction: column; }
      .portfolio-stats { gap: 1rem; }
      .real-sec-item { min-width: 70px; }
      .real-sec-item img { height: 70px; }
    }
  </style>

<body>
<div id="topbar-slot"></div><div id="navbar-slot"></div><div id="urgence-slot"></div>

<!-- Hero — rendu par JS depuis PORTFOLIO_DATA -->
<div id="portfolio-hero-root"></div>

<!-- Nav pills — rendu par JS -->
<nav class="theme-nav"><div class="theme-nav-inner" id="pills-root"></div></nav>

<!-- Sections — rendues par JS -->
<div id="sections-root"></div>

<!-- CTA -->
<section class="cta-section">
  <div class="container">
    <h2>Votre projet nous intéresse&nbsp;!</h2>
    <p>Demandez un devis gratuit pour votre chantier à Chambéry et en Savoie. Intervention rapide et soignée.</p>
    <div class="cta-btns">
      <a href="tel:0767915132" class="btn btn-white"><svg width="18" height="18" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"/></svg>07 67 91 51 32</a>
      <a href="index.html#contact" class="btn btn-outline">Demander un devis</a>
    </div>
  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()" />
  <div class="lightbox-caption" id="lightbox-caption"></div>
</div>

<div id="footer-slot"></div>
<script src="portfolio-data.js"></script>
<script src="components.js"></script>
<script>
  /* ─── Lightbox ─── */
  function openLightbox(img, caption) {
    const lb = document.getElementById('lightbox');
    document.getElementById('lightbox-img').src = img.src;
    document.getElementById('lightbox-img').alt = img.alt;
    document.getElementById('lightbox-caption').textContent = caption || img.alt;
    lb.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  /* ─── Helpers ─── */
  const ARROW = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
  const MONTHS = ['Jan.','Fév.','Mars','Avr.','Mai','Juin','Juil.','Août','Sept.','Oct.','Nov.','Déc.'];
  function fmtDate(d) {
    if (!d) return '';
    const [y, m] = d.split('-');
    return (MONTHS[parseInt(m,10)-1] || '') + ' ' + y;
  }
  function esc(s) { return (s||'').replace(/'/g,"&apos;").replace(/"/g,"&quot;"); }

  /* ─── Render hero ─── */
  function renderHero(hero) {
    const stats = hero.stats.map(s =>
      `<div class="portfolio-stat"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>`
    ).join('');
    document.getElementById('portfolio-hero-root').innerHTML = `
      <section class="portfolio-hero">
        <div class="container">
          <nav class="breadcrumb" style="justify-content:center;margin-bottom:1.5rem;">
            <a href="index.html" style="color:rgba(255,255,255,.8)">Accueil</a>
            <span class="breadcrumb-sep" style="color:rgba(255,255,255,.5)">›</span>
            <span class="breadcrumb-current" style="color:#fff">Portfolio</span>
          </nav>
          <h1>${hero.titre}</h1>
          <p>${hero.description}</p>
          <div class="portfolio-stats">${stats}</div>
        </div>
      </section>`;
  }

  /* ─── Render nav pills ─── */
  function renderPills(sections) {
    document.getElementById('pills-root').innerHTML = sections.map(s =>
      `<a href="#${s.id}" class="theme-pill">${s.icon} ${s.tag}</a>`
    ).join('');
  }

  /* ─── Render one réalisation fiche ─── */
  function renderFiche(r) {
    const date  = r.dateRealisation ? `<span class="real-chip">📅 ${fmtDate(r.dateRealisation)}</span>` : '';
    const ville = r.ville ? `<span class="real-chip">📍 ${r.ville}</span>` : '';

    let mainImg;
    if (r.type === 'avant-apres') {
      mainImg = `
        <div class="avant-apres-card">
          <img src="${r.imagePrincipale.src}" alt="${esc(r.imagePrincipale.alt)}" loading="lazy"
               onclick="openLightbox(this,'${esc(r.imagePrincipale.label)}')" />
          <div class="avant-apres-label">${r.imagePrincipale.label}</div>
        </div>`;
    } else {
      mainImg = `
        <div class="real-main-img-wrap">
          <img class="real-main-img" src="${r.imagePrincipale.src}" alt="${esc(r.imagePrincipale.alt)}" loading="lazy"
               onclick="openLightbox(this,'${esc(r.imagePrincipale.label)}')" />
          <div class="real-photo-label">${r.imagePrincipale.label}</div>
        </div>`;
    }

    const secondaires = r.imagesSecondaires.length ? `
      <div class="real-secondaires">
        ${r.imagesSecondaires.map(img => `
          <div class="real-sec-item">
            <img src="${img.src}" alt="${esc(img.alt)}" loading="lazy"
                 onclick="openLightbox(this,'${esc(img.label)}')" />
            <div class="real-sec-label">${img.label}</div>
          </div>`).join('')}
      </div>` : '';

    return `
      <div class="real-card reveal">
        ${mainImg}
        <div class="real-body">
          <div class="real-meta">${date}${ville}</div>
          <h3 class="real-titre">${r.titrePrincipal}</h3>
          ${r.titreSecondaire ? `<p class="real-sous-titre">${r.titreSecondaire}</p>` : ''}
          ${r.descriptif ? `<p class="real-desc">${r.descriptif}</p>` : ''}
          ${secondaires}
        </div>
      </div>`;
  }

  /* ─── Render one section ─── */
  function renderSection(s) {
    const gridClass = s.realisations.length === 1 ? 'reals-single' : 'reals-grid';
    return `
      <section class="portfolio-section" id="${s.id}">
        <div class="container">
          <div class="section-header">
            <div class="section-icon">${s.icon}</div>
            <div>
              <span class="tag">${s.tag}</span>
              <h2 class="section-title" style="margin-top:.5rem;">${s.titreSection}</h2>
              <p class="section-sub">${s.descriptionSection}</p>
              <a href="${s.lienService}" class="section-service-link">Voir notre service ${s.nomService} ${ARROW}</a>
            </div>
          </div>
          <div class="${gridClass}">
            ${s.realisations.map(r => renderFiche(r)).join('')}
          </div>
        </div>
      </section>`;
  }

  /* ─── Bootstrap ─── */
  (function init() {
    // Priorité : données admin en localStorage, sinon fichier portfolio-data.js
    let data;
    try {
      const saved = localStorage.getItem('ams_portfolio_data');
      data = saved ? JSON.parse(saved) : PORTFOLIO_DATA;
    } catch(e) { data = PORTFOLIO_DATA; }

    renderHero(data.hero);
    renderPills(data.sections);
    document.getElementById('sections-root').innerHTML = data.sections.map(renderSection).join('');

    // Scroll-reveal
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));

    // Active pill on scroll
    const sections = document.querySelectorAll('.portfolio-section');
    const pills    = document.querySelectorAll('.theme-pill');
    const pillObs  = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id;
          pills.forEach(p => p.classList.toggle('active', p.getAttribute('href') === '#' + id));
        }
      });
    }, { threshold: 0.3 });
    sections.forEach(s => pillObs.observe(s));
  })();
</script>
</body>
